<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Journey 🌙</title>
    <style>
        :root { --primary: #ff3366; --gold: #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: 'Arial', sans-serif; overflow: hidden; color: white; }

        /* Matrix Background */
        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.3; pointer-events: none; }

        .page {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; z-index: 10; transition: all 1s ease-in-out;
        }

        .hidden { opacity: 0; pointer-events: none; transform: scale(0.9); display: none !important; }

        /* Glass Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px;
            border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 80%;
        }

        /* Heart Layout */
        .heart-container { position: relative; width: 320px; height: 320px; margin-bottom: 20px; }
        .photo-chip {
            position: absolute; width: 65px; height: 65px; border-radius: 12px;
            border: 2px solid var(--primary); object-fit: cover;
            animation: float 4s ease-in-out infinite;
        }

        /* Typing Effect Text */
        #typewriter { font-size: 1.5rem; color: var(--gold); min-height: 50px; line-height: 1.6; }

        /* Buttons */
        .btn {
            background: var(--primary); color: white; border: none;
            padding: 12px 30px; border-radius: 50px; font-weight: bold;
            cursor: pointer; margin-top: 20px; box-shadow: 0 0 15px var(--primary);
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* Special Fireworks */
    
        .sparkle { position: absolute; background: white; border-radius: 50%; pointer-events: none; }
/* Update this part in your <style> section */
.photo-chip {
    position: absolute; 
    width: 70px; 
    height: 70px; 
    border-radius: 12px;
    border: 2px solid var(--primary); 
    object-fit: cover;
    /* This makes them move! */
    animation: float 3s ease-in-out infinite; 
    box-shadow: 0 0 15px var(--primary);
    transition: transform 0.3s;
}

/* The movement logic */
@keyframes float {
    0% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(5px, -10px) rotate(2deg); }
    66% { transform: translate(-5px, -5px) rotate(-2deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
    }
      /* This makes the center image special */
.photo-chip:last-child {
    width: 90px;
    height: 90px;
    z-index: 100;
    border: 3px solid var(--gold);
    box-shadow: 0 0 25px var(--gold);
}
        
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="p1" class="page">
        <div class="glass-card">
            <h2 style="color: var(--gold);">Hey Gorgeous...</h2>
            <p>I have something special for you.</p>
            <button class="btn" onclick="nextPage(1, 2)">Open It 🎁</button>
        </div>
    </div>

    <div id="p2" class="page hidden">
        <div class="heart-container" id="photoHeart"></div>
        <div class="glass-card">
            <h1>Eid Mubarak 💖</h1>
            <p>Every moment with you is a blessing.</p>
            <button class="btn" onclick="nextPage(2, 3)">Read My Message 💌</button>
        </div>
    </div>

    <div id="p3" class="page hidden">
        <div class="glass-card">
            <div id="typewriter"></div>
            <button id="msgBtn" class="btn hidden" onclick="nextPage(3, 4)">One More Thing... ✨</button>
        </div>
    </div>

    <div id="p4" class="page hidden">
        <div class="glass-card">
            <h1 style="font-size: 3rem;">🌙✨</h1>
            <h2 style="color: var(--gold);">Forever & Always</h2>
            <p>May this Eid bring us closer together.</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=I_LOVE_YOU_SO_MUCH" style="border-radius: 10px; margin: 15px;">
            <p style="font-size: 0.8rem;">(Scan for a secret)</p>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mp3">
    </audio>

<script>
    // Matrix Background (Pink)
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = "EIDMUBARAK❤️❤️✨🌙";
    const drops = Array(Math.floor(canvas.width/15)).fill(1);
    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff3366"; ctx.font = "15px monospace";
        drops.forEach((y, i) => {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * 15, y * 15);
            if (y * 15 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(drawMatrix, 50);

    function nextPage(current, next) {
        document.getElementById(`p${current}`).classList.add('hidden');
        const nextPg = document.getElementById(`p${next}`);
        nextPg.classList.remove('hidden');
        
        // Start music on first click
        if(current === 1) {
            document.getElementById('bgMusic').play();
            createHeart();
        }
        
        // Start typing effect on Page 3
        if(next === 3) {
            typeWriter("To the most beautiful person... I just wanted to say that you are the moon in my sky. Thank you for making my life so bright. Eid Mubarak, my love! ❤️", "typewriter");
        }

        // Sparkle effect
        for(let i=0; i<15; i++) createSparkle();
    }

    function createHeart() {
        const container = document.getElementById('photoHeart');
        const coords = [
            {x: 50, y: 25}, {x: 30, y: 15}, {x: 70, y: 15}, {x: 10, y: 30}, 
            {x: 90, y: 30}, {x: 15, y: 55}, {x: 85, y: 55}, {x: 35, y: 75}, 
            {x: 65, y: 75}, {x: 50, y: 90}, {x: 50, y: 50}
        ];
        coords.forEach((pos, i) => {
            const img = document.createElement('img');
            img.src = (i + 1) + ".jpg";
            img.className = 'photo-chip';
            img.style.left = pos.x + '%'; img.style.top = pos.y + '%';
            img.style.animationDelay = (i * 0.2) + 's';
            container.appendChild(img);
        });
    }

    function typeWriter(text, elementId) {
        let i = 0;
        const ele = document.getElementById(elementId);
        ele.innerHTML = "";
        function type() {
            if (i < text.length) {
                ele.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, 70);
            } else {
                document.getElementById('msgBtn').classList.remove('hidden');
            }
        }
        type();
    }

    function createSparkle() {
        const s = document.createElement('div');
        s.className = 'sparkle';
        const size = Math.random() * 5 + 2;
        s.style.width = size + 'px'; s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1000);
    }
    /* Falling Hearts Style */
.falling-heart {
    position: absolute;
    color: #ff1a75; /* Matches your romantic pink */
    font-size: 20px;
    user-select: none;
    pointer-events: none;
    z-index: 5;
    animation: fall linear forwards;
}

@keyframes fall {
    0% {
        transform: translateY(-10vh) translateX(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(105vh) translateX(100px) rotate(360deg);
        opacity: 0;
    }
                                                }
        // Function to create falling hearts
function startHearts() {
    setInterval(() => {
        const heart = document.createElement('div');
        heart.innerHTML = "❤️"; // You can change this to 💖 or ✨
        heart.className = 'falling-heart';
        
        // Randomize position and speed
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s"; 
        heart.style.opacity = Math.random();
        heart.style.fontSize = (Math.random() * 20 + 10) + "px";
        
        document.body.appendChild(heart);
        
        // Remove heart after it falls to keep the site fast
        setTimeout(() => {
            heart.remove();
        }, 5000);
    }, 300); // Creates a new heart every 300ms
}

// Start the hearts when the first button is clicked
// Update your existing nextPage function to include startHearts();
const originalNextPage = nextPage;
nextPage = function(current, next) {
    if(current === 1) startHearts();
    originalNextPage(current, next);
};
    
</script>
</body>
</html>
